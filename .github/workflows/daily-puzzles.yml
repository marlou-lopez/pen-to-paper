name: Daily reMarkable Puzzle Generator

on:
  schedule:
    # Runs at 21:00 UTC (05:00/06:00 AM local morning time)
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      puzzle_type:
        description: 'Type of puzzle to generate'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - word-search
          - sudoku
          - mini-crossword
          - kenken
          - kakuro
          - futoshiki
      sudoku_difficulty:
        description: 'Sudoku difficulty'
        required: true
        default: 'random'
        type: choice
        options:
          - random
          - easy
          - medium
          - hard
          - expert
      sudoku_grid:
        description: 'Custom Sudoku grid using x notation (optional)'
        required: false
        default: ''
        type: string
      kenken_size:
        description: 'KenKen grid size (3-9)'
        required: false
        default: '6'
        type: choice
        options:
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
          - '8'
          - '9'
      kenken_difficulty:
        description: 'KenKen difficulty'
        required: false
        default: 'medium'
        type: choice
        options:
          - easy
          - medium
          - hard
      kakuro_size:
        description: 'Kakuro grid size (6, 8, 10)'
        required: false
        default: '8'
        type: choice
        options:
          - '6'
          - '8'
          - '10'
      kakuro_difficulty:
        description: 'Kakuro difficulty'
        required: false
        default: 'medium'
        type: choice
        options:
          - easy
          - medium
          - hard
      futoshiki_size:
        description: 'Futoshiki grid size (4, 5, 6)'
        required: false
        default: '5'
        type: choice
        options:
          - '4'
          - '5'
          - '6'
      futoshiki_difficulty:
        description: 'Futoshiki difficulty'
        required: false
        default: 'medium'
        type: choice
        options:
          - easy
          - medium
          - hard
      word_search_theme:
        description: 'Word Search theme (optional; blank for dynamic)'
        required: false
        default: ''
        type: string
      crossword_theme:
        description: 'Mini Crossword theme (optional; blank for dynamic/seed)'
        required: false
        default: ''
        type: string
      is_daily:
        description: 'Deliver to /Puzzles/Daily (true) or Category folders (false)'
        type: boolean
        required: false
        default: true

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    env:
      RMAPI_AUTH_TOKEN: ${{ secrets.RMAPI_AUTH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install rmapi
        run: |
          mkdir -p $HOME/bin
          curl -L -s https://github.com/ddvk/rmapi/releases/download/v0.0.35/rmapi-linux-amd64.tar.gz | tar xz -C $HOME/bin
          chmod +x $HOME/bin/rmapi
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup rmapi auth
        run: |
          if [ -n "$RMAPI_AUTH_TOKEN" ]; then
            mkdir -p ~/.config/rmapi
            echo "$RMAPI_AUTH_TOKEN" > ~/.rmapi
            echo "$RMAPI_AUTH_TOKEN" > ~/.config/rmapi/rmapi.conf
            echo "rmapi credentials configured."
          else
            echo "RMAPI_AUTH_TOKEN not provided; skipping auth setup."
          fi

      - name: Run puzzle generation & upload
        env:
          THEME_PARAM: ${{ inputs.word_search_theme }}
          CROSSWORD_THEME: ${{ inputs.crossword_theme }}
          GRID_PARAM: ${{ inputs.sudoku_grid }}
          PUZZLE_TYPE: ${{ inputs.puzzle_type || 'all' }}
          SUDOKU_DIFF: ${{ inputs.sudoku_difficulty || 'random' }}
          KENKEN_SIZE: ${{ inputs.kenken_size || '6' }}
          KENKEN_DIFF: ${{ inputs.kenken_difficulty || 'medium' }}
          KAKURO_SIZE: ${{ inputs.kakuro_size || '8' }}
          KAKURO_DIFF: ${{ inputs.kakuro_difficulty || 'medium' }}
          FUTOSHIKI_SIZE: ${{ inputs.futoshiki_size || '5' }}
          FUTOSHIKI_DIFF: ${{ inputs.futoshiki_difficulty || 'medium' }}
          IS_DAILY: ${{ inputs.is_daily }}
        run: |
          THEME_FLAG=""
          if [ "$PUZZLE_TYPE" = "mini-crossword" ] && [ -n "$CROSSWORD_THEME" ]; then
            THEME_FLAG="--theme=$CROSSWORD_THEME"
          elif [ -n "$THEME_PARAM" ]; then
            THEME_FLAG="--theme=$THEME_PARAM"
          fi

          GRID_FLAG=""
          if [ -n "$GRID_PARAM" ]; then
            GRID_FLAG="--grid=$GRID_PARAM"
          fi

          DIFF_FLAG=""
          if [ "$PUZZLE_TYPE" = "kenken" ]; then
            DIFF_FLAG="--difficulty=$KENKEN_DIFF"
          elif [ "$PUZZLE_TYPE" = "kakuro" ]; then
            DIFF_FLAG="--difficulty=$KAKURO_DIFF"
          elif [ "$PUZZLE_TYPE" = "futoshiki" ]; then
            DIFF_FLAG="--difficulty=$FUTOSHIKI_DIFF"
          else
            DIFF_FLAG="--difficulty=$SUDOKU_DIFF"
          fi

          SIZE_FLAG=""
          if [ "$PUZZLE_TYPE" = "kakuro" ]; then
            SIZE_FLAG="--size=$KAKURO_SIZE"
          elif [ "$PUZZLE_TYPE" = "kenken" ]; then
            SIZE_FLAG="--size=$KENKEN_SIZE"
          elif [ "$PUZZLE_TYPE" = "futoshiki" ]; then
            SIZE_FLAG="--size=$FUTOSHIKI_SIZE"
          fi

          DAILY_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$IS_DAILY" != "false" ]; then
            DAILY_FLAG="--daily"
          fi

          npm run generate -- \
            --type="$PUZZLE_TYPE" \
            $DIFF_FLAG \
            $SIZE_FLAG \
            $THEME_FLAG \
            $DAILY_FLAG \
            $GRID_FLAG \
            --upload
