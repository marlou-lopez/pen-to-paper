name: Daily reMarkable Puzzle Generator

on:
  schedule:
    # Runs at 21:00 UTC (05:00/06:00 AM local morning time)
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      puzzle_type:
        description: 'Type of puzzle to generate'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - word-search
          - sudoku
      sudoku_difficulty:
        description: 'Sudoku difficulty'
        required: true
        default: 'random'
        type: choice
        options:
          - random
          - easy
          - medium
          - hard
          - expert
      word_search_theme:
        description: 'Word Search theme (optional; blank for dynamic)'
        required: false
        default: ''
        type: string

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    env:
      RMAPI_AUTH_TOKEN: ${{ secrets.RMAPI_AUTH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install rmapi
        run: |
          mkdir -p $HOME/bin
          curl -L -s https://github.com/juruen/rmapi/releases/download/v0.0.26/rmapi-linuxx64.tar.gz | tar xz -C $HOME/bin
          chmod +x $HOME/bin/rmapi
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup rmapi auth
        if: "${{ secrets.RMAPI_AUTH_TOKEN != '' }}"
        run: |
          mkdir -p ~/.config/rmapi
          echo "$RMAPI_AUTH_TOKEN" > ~/.rmapi
          echo "$RMAPI_AUTH_TOKEN" > ~/.config/rmapi/rmapi.conf

      - name: Run puzzle generation & upload
        run: |
          THEME_PARAM="${{ inputs.word_search_theme }}"
          THEME_FLAG=""
          if [ -n "$THEME_PARAM" ]; then
            THEME_FLAG="--theme=$THEME_PARAM"
          fi
          npm run generate -- \
            --type=${{ inputs.puzzle_type || 'all' }} \
            --difficulty=${{ inputs.sudoku_difficulty || 'random' }} \
            $THEME_FLAG \
            --upload
